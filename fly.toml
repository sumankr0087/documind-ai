# fly.toml app configuration file for DocuMind AI
app = "documind-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8000"
  CHROMA_PERSIST_DIRECTORY = "/app/data/chroma"
  UPLOAD_DIR = "/app/data/uploads"
  EMBEDDING_MODEL_NAME = "sentence-transformers/all-MiniLM-L6-v2"
  EMBEDDING_DEVICE = "cpu"
  LLM_PROVIDER = "openai"
  LLM_MODEL = "gpt-4o-mini"
  LLM_TEMPERATURE = "0.0"

[mounts]
  source = "documind_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
