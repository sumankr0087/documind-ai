name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set. Please add HF_TOKEN in GitHub repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          git push --force https://Sumankr0087:$HF_TOKEN@huggingface.co/spaces/Sumankr0087/documind-ai main
